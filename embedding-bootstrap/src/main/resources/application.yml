# Plan 2 Task M2b：embedding 服务统一配置。
# - 监听 8080（部署到 old 服务器）。
# - sanyan.embedding.internal-token：必须从环境变量 EMBEDDING_INTERNAL_TOKEN 注入；
#   未配置时 InternalTokenInterceptor 直接 500 拒绝所有请求（运维问题）。
# - sanyan.embedding.model.cache-dir：DJL / ONNX Runtime 模型缓存目录；
#   部署机用 /var/cache/fastembed（保留命名，与 plan 中的运维路径一致）。
# - management.endpoints.web.exposure：只暴露 health / info；
#   EmbeddingHealthIndicator 在模型 ready 前返回 OUT_OF_SERVICE。

spring:
  application:
    name: sanyan-embedding

server:
  port: 8080

sanyan:
  embedding:
    # 内部 token：必须从环境变量注入。缺失时拦截器返回 500 拒绝所有请求。
    internal-token: ${EMBEDDING_INTERNAL_TOKEN:}
    model:
      # DJL HuggingFace PyTorch 模型 URL（默认 BAAI/bge-m3，1024 维）
      # 注：onnxruntime zoo 没有 bge-m3，所以走 pytorch zoo
      url: djl://ai.djl.huggingface.pytorch/BAAI/bge-m3
      # DJL 模型 + PyTorch native 库的缓存目录
      cache-dir: ${EMBEDDING_MODEL_CACHE_DIR:/var/cache/fastembed}

# DJL 引擎缓存目录从环境变量映射（DJL 自身读 DJL_CACHE_DIR / ENGINE_CACHE_DIR）。
# 用 systemd 的 Environment= 注入到进程级即可。

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.sanyan.embedding: INFO
    ai.djl: INFO
