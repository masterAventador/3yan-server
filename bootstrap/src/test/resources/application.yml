spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

sanyan:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac-sha-testing
    expiration-days: 1
  doubao:
    api-key: test
    model: test
    base-url: http://localhost:9999
  cos:
    secret-id: test
    secret-key: test
    bucket: test-bucket
    region: ap-guangzhou
  tts:
    enabled: false
    app-id: test
    access-token: test
  # proactive 全上下文 IT 需要：GreetingDailyTrigger @Scheduled cron 占位符必须可解析，
  # FrequencyGate 读 scenes-by-stage（默认空 Map 会拒所有场景）。镜像 main application.yml。
  proactive:
    greeting:
      morning-cron: "0 0 8 * * *"
      night-cron: "0 30 22 * * *"
    recall:
      thresholds-hours: [24, 72, 168]
    quiet-hours:
      start: 23
      end: 8
    scatter-window-minutes: 30
    daily-cap-by-stage: [2, 3, 4, 5, 6]
    scenes-by-stage:
      0: { morning: false, night: false, recall: true,  event-followup: true,  emotion-care: false }
      1: { morning: false, night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      2: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      3: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      4: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }
