spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # @Async 默认线程池（ThreadPoolTaskExecutor）。Spring Boot 默认 max-size 无界，主动消息
  # 投递（ProactiveDispatcher.dispatch @Async，每 segment 同步等 ACK）积压时会线程爆——
  # 故设上限 + 有界队列：超 max-size 且队满走默认 AbortPolicy，由 dispatch fire-and-forget
  # 调用方（ProactiveScheduler）下一轮 fixedDelay 重新领取重试。
  task:
    execution:
      pool:
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: proactive-
  # ===== 所有 profile 共享的基础设施配置（dev / prod 在自己的 yml 里按需 override）=====
  datasource:
    # dev 本机 PG / 线上 PG 都在 localhost，user/password 走环境变量注入
    url: jdbc:postgresql://localhost:5432/sanyan
    username: ${PG_USER:sanyan}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true  # 生产首次启动 baseline 后，建议改 false 防止误删 schema 后自动 re-baseline
    baseline-version: 1
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: 8080

sanyan:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-sanyan-app-change-in-production}
    expiration-days: 30

  sms:
    provider: ${SMS_PROVIDER:stub}        # dev 默认 stub；prod 在 env 设 tencent
    tencent:
      secret-id: ${SMS_TENCENT_SECRET_ID:}
      secret-key: ${SMS_TENCENT_SECRET_KEY:}
      sdk-app-id: ${SMS_TENCENT_SDK_APP_ID:}
      sign-name: ${SMS_TENCENT_SIGN_NAME:}
      template-id: ${SMS_TENCENT_TEMPLATE_ID:}
      region: ${SMS_TENCENT_REGION:ap-guangzhou}

  oauth:
    apple:
      allowed-aud: ${OAUTH_APPLE_ALLOWED_AUD:}     # 逗号分隔的 bundleId 白名单，如 com.sanyan.app
    wechat:
      appid: ${OAUTH_WECHAT_APPID:}
      secret: ${OAUTH_WECHAT_SECRET:}              # 微信 AppSecret，仅服务端用，禁止下发客户端 / 入日志
    bind-ticket:
      # bindTicket 独立 HMAC 密钥（≠ jwt.secret），≥32 字节。dev 给占位默认值保证本地能起 context，
      # prod 必须用 OAUTH_BIND_TICKET_SECRET env 覆盖（BindTicketUtil 用 @Value 直接读，空/太短会启动失败）。
      secret: ${OAUTH_BIND_TICKET_SECRET:dev-only-bind-ticket-secret-change-in-prod-min-32-bytes}
      ttl-minutes: ${OAUTH_BIND_TICKET_TTL_MINUTES:10}

  intimacy:
    stages:
      strangerEnd: 100
      friendEnd: 300
      ambiguousEnd: 600
      loverEnd: 1000
    delta:
      messageSent: 1
      messageDailyCap: 50
      dailyLogin: 10
      streakBonusPerDay: 5
      streakBonusCap: 50
    rules:
      deepNightChat: 50
      firstHonestShare: 30
    ai:
      qualityMaxScore: 20
      triggerEveryNMessages: 10

  # ===== 第三方 LLM / Embedding 配置（base，对所有 profile 生效）=====
  # API key 走环境变量注入，配置文件不写 fallback 值：
  #   - 本机 dev：从 ~/.zshrc export DOUBAO_API_KEY / DEEPSEEK_API_KEY / SILICONFLOW_API_KEY
  #   - 线上 prod：从 /opt/3yan/3yan-server/.env 注入（见 deploy.sh），且 application-prod.yml
  #     覆盖为无 fallback 的严格写法，启动时缺 key 直接 fail-fast
  doubao:
    # 2026-05-25 起豆包默认禁用（task-types 空），保留 adapter + 配置以便未来一键 yml 切回。
    # 历史 USER_FACING 路由曾走 doubao-seed-character；dogfood 发现多 system 块密集
    # prompt 下豆包 character 模型会把 system 元数据当 assistant 回复输出。
    task-types: ""
    api-key: ${DOUBAO_API_KEY:}
    base-url: https://ark.cn-beijing.volces.com/api/v3
    model: ep-20260408102845-f86mb
  llm:
    deepseek:
      # 2026-05-25 起 DeepSeek V4-Flash 接所有任务（USER_FACING + BACKGROUND），统一 provider。
      task-types: USER_FACING,BACKGROUND
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
  embedding:
    # 走硅基流动托管的 BAAI/bge-m3（OpenAI 兼容 /embeddings，免费）
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
    http:
      # 公网 RTT 30-80ms，connect 3s 足够覆盖偶发抖动
      connect-timeout-ms: 3000
      # 单次推理 200-800ms（取决于 batch 大小），10s 是充足兜底
      read-timeout-ms: 10000
      # 5xx / 网络异常重试 2 次（共 3 次尝试），4xx 不重试
      max-retries: 2
      # 首次退避 500ms，按 2 倍指数增长（500 → 1000 → 2000）
      retry-backoff-ms: 500

  proactive:
    greeting:
      morning-cron: "0 0 8 * * *"
      night-cron: "0 30 22 * * *"
    recall:
      scan-interval-ms: 900000               # 15min；可被 SANYAN_PROACTIVE_RECALL_SCANINTERVALMS env 覆盖
      thresholds-hours: [24, 72, 168]        # 24h / 3天 / 7天
    quiet-hours:
      start: 23
      end: 8
    scatter-window-minutes: 30
    daily-cap-by-stage: [2, 3, 4, 5, 6]       # stage 0..4
    scenes-by-stage:
      0: { morning: false, night: false, recall: true,  event-followup: true,  emotion-care: false }
      1: { morning: false, night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      2: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      3: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }
      4: { morning: true,  night: true,  recall: true,  event-followup: true,  emotion-care: true  }

  push:
    apns:
      # 本期 L3 实推未通，占位配置；实接入等 .p8 证书（spec §8 待办）
      enabled: false
      auth-key-path: ${APNS_AUTH_KEY_PATH:}
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      topic: ${APNS_TOPIC:}                   # bundleId
