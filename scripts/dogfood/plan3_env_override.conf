# Plan 3 dogfood 阈值覆盖配置
# 由 run_dogfood.sh --plan3 追加到 /etc/3yan/3yan-server.env，测试结束后自动回滚。
#
# 设计考虑：DAILY_LOGIN 首次会涨 15（base 10 + streak1 bonus 5），所以 strangerEnd 必须 > 15
# 否则 baseline 一上来就跳过 stage 0。
#
# 原始阈值 → 缩短后（dogfood 测试用）：
#   stage_0 stranger:  0-100   → 0-20    （留 5 分缓冲超 DAILY_LOGIN=15）
#   stage_1 friend:    100-300 → 20-40
#   stage_2 ambiguous: 300-600 → 40-60
#   stage_3 lover:     600-1000 → 60-80
#   stage_4 married:   1000+   → 80+
#   ai trigger:        每 10 条 → 每 3 条

SANYAN_INTIMACY_STAGES_STRANGEREND=20
SANYAN_INTIMACY_STAGES_FRIENDEND=40
SANYAN_INTIMACY_STAGES_AMBIGUOUSEND=60
SANYAN_INTIMACY_STAGES_LOVEREND=80
SANYAN_INTIMACY_DELTA_MESSAGEDAILYCAP=50
SANYAN_INTIMACY_AI_TRIGGEREVERYNMESSAGES=3
