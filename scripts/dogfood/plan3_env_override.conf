# Plan 3 dogfood 阈值覆盖配置
# 由 run_dogfood.sh --plan3 追加到 /etc/3yan/3yan-server.env，测试结束后自动回滚。
#
# 原始阈值 → 缩短后（dogfood 测试用）：
#   stage_0 stranger:  0-100  → 0-5
#   stage_1 friend:    100-300 → 5-15
#   stage_2 ambiguous: 300-600 → 15-30
#   stage_3 lover:     600-1000 → 30-50
#   stage_4 married:   1000+   → 50+
#   ai trigger:        每 10 条 → 每 3 条

SANYAN_INTIMACY_STAGES_STRANGEREND=5
SANYAN_INTIMACY_STAGES_FRIENDEND=15
SANYAN_INTIMACY_STAGES_AMBIGUOUSEND=30
SANYAN_INTIMACY_STAGES_LOVEREND=50
SANYAN_INTIMACY_DELTA_MESSAGEDAILYCAP=50
SANYAN_INTIMACY_AI_TRIGGEREVERYNMESSAGES=3
